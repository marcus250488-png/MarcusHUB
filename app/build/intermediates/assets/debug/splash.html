<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Marcus Hub — Boot</title>
<style>
:root{
  --gold:#f2c94c; --cream:#f6e6a4; --steel:#7ea6c4; --line:#3b82a0;
  --blue:#4da6ff; --pink:#ff5da2; --green:#2ee66b; --orange:#ff8c3a; --yellow:#ffd23f;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000}
body{
  position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
svg{display:block}
svg *{fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---------- halo + flash de boot ---------- */
.halo{
  position:fixed;left:50%;top:40.5%;width:125vmin;height:125vmin;pointer-events:none;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,200,90,.10) 0%,rgba(70,130,180,.07) 38%,transparent 68%);
  opacity:0;
  animation:appear 1.4s ease .8s both, haloPulse 6s ease-in-out 3.4s infinite;
}
.bootflash{
  position:fixed;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:radial-gradient(circle at 50% 40.5%,rgba(255,240,190,.9),rgba(255,190,80,.25) 30%,transparent 62%);
  animation:bootflash .9s ease-out .6s both;
}

/* ---------- cantos HUD ---------- */
.corner{position:fixed;width:24px;height:24px;border:2px solid rgba(126,166,196,.8);opacity:0;animation:cornerIn .6s cubic-bezier(.3,1.3,.5,1) both}
.tl{top:calc(16px + env(safe-area-inset-top));left:16px;border-right:0;border-bottom:0;transform-origin:top left;animation-delay:.05s}
.tr{top:calc(16px + env(safe-area-inset-top));right:16px;border-left:0;border-bottom:0;transform-origin:top right;animation-delay:.12s}
.br{bottom:calc(16px + env(safe-area-inset-bottom));right:16px;border-left:0;border-top:0;transform-origin:bottom right;animation-delay:.19s}
.bl{bottom:calc(16px + env(safe-area-inset-bottom));left:16px;border-right:0;border-top:0;transform-origin:bottom left;animation-delay:.26s}

/* ---------- diagrama ---------- */
.dwrap{position:absolute;left:50%;top:40.5%;width:min(96vw,62vh);aspect-ratio:1;transform:translate(-50%,-50%)}
.diagram{width:100%;height:100%;overflow:visible;animation:floaty 7s ease-in-out 4s infinite}

.ring{stroke:var(--line);stroke-width:1}
.r1{stroke-opacity:.50}.r2{stroke-opacity:.36}.r3{stroke-opacity:.26}
.rings{transform-box:fill-box;transform-origin:center;animation:appear 1.2s ease 2.6s both}

.ticks{transform-box:fill-box;transform-origin:center;animation:appear 1s ease 2.8s both, spin 90s linear infinite}
.tickring{stroke:#6fb3d9;stroke-opacity:.55;stroke-width:2;stroke-dasharray:2 16}

.penta{stroke:#5a7f96;stroke-opacity:.30;stroke-width:1;animation:appear 1.2s ease 3s both}

.lockring{stroke:var(--cream);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center;
  animation:lockPing 1s ease-out 5.4s forwards}

.spoke{stroke:currentColor;stroke-width:2.6;stroke-dasharray:1;stroke-dashoffset:1;
  filter:drop-shadow(0 0 3px currentColor);
  animation:draw .8s cubic-bezier(.5,0,.3,1) var(--d) forwards}
.s-blue{color:var(--blue)}.s-pink{color:var(--pink)}.s-green{color:var(--green)}
.s-orange{color:var(--orange)}.s-yellow{color:var(--yellow)}

.pulse{opacity:0;animation:pulseTravel 2.4s cubic-bezier(.4,0,.6,1) var(--pd) infinite;
  filter:drop-shadow(0 0 4px currentColor)}
.pulse .head{fill:currentColor;stroke:none}
.pulse .glowc{fill:currentColor;stroke:none;opacity:.22}
.p-blue{color:var(--blue)}.p-pink{color:var(--pink)}.p-green{color:var(--green)}
.p-orange{color:var(--orange)}.p-yellow{color:var(--yellow)}

/* core central: agenda */
.core{transform-box:fill-box;transform-origin:center;
  filter:drop-shadow(0 0 6px rgba(242,201,76,.8)) drop-shadow(0 0 22px rgba(242,201,76,.35));
  animation:coreIn .9s cubic-bezier(.3,1.4,.4,1) .5s both}
.sonar{stroke:var(--gold);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center;
  animation:sonar 2.8s linear infinite}
.sonar.s1{animation-delay:2.2s}.sonar.s2{animation-delay:3.6s}
.coreRing{stroke:#d9b45c;stroke-width:2.5}
.coreTick{stroke:#fff;stroke-width:2;stroke-opacity:.95}
.coreIcon{stroke:var(--cream);stroke-width:2.4;transform-box:fill-box;transform-origin:center;
  animation:breathe 3.4s ease-in-out 3s infinite}
.coreIcon .dot{fill:var(--cream);stroke:none}

/* nós */
.node{transform-box:fill-box;transform-origin:center;
  animation:popIn .65s cubic-bezier(.3,1.5,.5,1) var(--d) both;
  filter:drop-shadow(0 0 4px currentColor);
  filter:drop-shadow(0 0 4px currentColor) drop-shadow(0 0 16px color-mix(in srgb,currentColor 40%,transparent))}
.node line,.node circle,.node rect,.node polyline,.node path{stroke:currentColor;stroke-width:3.4}
.node .dot{fill:currentColor;stroke:none}
.node .flash{stroke:currentColor;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;
  animation:flashRing .7s ease-out var(--d) forwards}
.n-blue{color:var(--blue)}.n-pink{color:var(--pink)}.n-green{color:var(--green)}
.n-orange{color:var(--orange)}.n-yellow{color:var(--yellow)}
.n-stocks line,.n-stocks polyline,.n-stocks rect{stroke-width:2.6}

/* ---------- textos ---------- */
.title{position:absolute;left:0;right:0;top:63%;text-align:center;pointer-events:none}
.title h1{
  font-weight:900;font-size:clamp(2.4rem,11vw,4.6rem);letter-spacing:.14em;color:var(--cream);
  text-shadow:0 0 26px rgba(246,230,164,.28);
  animation:titleIn 1.1s cubic-bezier(.2,.7,.2,1) 3.4s both;
}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .title h1{
    background:linear-gradient(100deg,var(--cream) 0%,var(--cream) 40%,#fffdf0 50%,var(--cream) 60%,var(--cream) 100%);
    background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:titleIn 1.1s cubic-bezier(.2,.7,.2,1) 3.4s both, shimmer 6s linear 5.4s infinite;
  }
}
.title p{
  margin-top:.9em;color:#a8bccb;font-size:clamp(.72rem,3.2vw,1rem);letter-spacing:.34em;
  animation:subIn .9s ease 3.95s both;
}
.status{
  position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));text-align:center;
  font:500 12px/1 ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,monospace;
  letter-spacing:.28em;color:var(--steel);
  animation:statusIn .9s ease 4.5s both;
}
.status::after{content:"";display:inline-block;width:7px;height:12px;margin-left:9px;vertical-align:-1px;
  background:var(--steel);opacity:0;animation:blink 1.1s steps(1) 5.2s infinite}

/* ---------- keyframes ---------- */
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes cornerIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes bootflash{0%{opacity:0}15%{opacity:.55}100%{opacity:0}}
@keyframes haloPulse{0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
@keyframes coreIn{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes sonar{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.5);opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes popIn{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes flashRing{0%{opacity:.9;transform:scale(.5)}100%{opacity:0;transform:scale(1.7)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lockPing{0%{opacity:.5;transform:scale(.92)}100%{opacity:0;transform:scale(1.06)}}
@keyframes pulseTravel{0%{transform:translate(0,0);opacity:0}12%{opacity:1}80%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes titleIn{0%{opacity:0;transform:translateY(26px);filter:blur(10px);letter-spacing:.4em}100%{opacity:1;transform:translateY(0);filter:blur(0);letter-spacing:.14em}}
@keyframes subIn{0%{opacity:0;transform:translateY(14px);letter-spacing:.6em}100%{opacity:.85;transform:translateY(0);letter-spacing:.34em}}
@keyframes shimmer{0%{background-position:130% 0}100%{background-position:-130% 0}}
@keyframes statusIn{from{opacity:0;letter-spacing:.5em}to{opacity:.9;letter-spacing:.28em}}
@keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}

@media (orientation:landscape){
  .dwrap{top:46%;width:min(58vh,44vw)}
  .title{top:auto;bottom:10%}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>

<div class="halo"></div>
<div class="bootflash"></div>
<i class="corner tl"></i><i class="corner tr"></i><i class="corner br"></i><i class="corner bl"></i>

<div class="dwrap">
<svg class="diagram" viewBox="0 0 720 720" aria-hidden="true">

  <!-- anéis + ticks + pentágono -->
  <g class="rings">
    <circle class="ring r1" cx="360" cy="360" r="84"/>

  <!-- core central: AGENDA -->
  <g class="core">

      <rect x="344" y="348" width="32" height="26" rx="5"/>

      <line x1="366" y1="365" x2="370" y2="365"/>

  </g>

  <!-- TOPO: treino -->
  <g class="node n-blue" style="--d:1.85s">
    <circle class="flash" cx="360" cy="108" r="34"/>
    <line x1="342" y1="108" x2="378" y2="108"/>
    <line x1="334" y1="94"  x2="334" y2="122"/><line x1="326" y1="99"  x2="326" y2="117"/>
    <line x1="386" y1="94"  x2="386" y2="122"/><line x1="394" y1="99"  x2="394" y2="117"/>

  <!-- SUPERIOR DIR: doceria -->
  <g class="node n-pink" style="--d:2.10s">
    <circle class="flash" cx="600" cy="285" r="34"/>

  <!-- INFERIOR ESQ: cortes -->
  <g class="node n-orange" style="--d:2.60s">

  <g class="node n-yellow" style="--d:2.85s">

</svg>
</div>

<div class="title">
  <h1>MARCUS HUB</h1>
  <p>UM ECOSSISTEMA CONECTADO</p>
</div>

<div class="status">SYNC / CORE ONLINE</div>

<script>
const setVh=()=>document.documentElement.style.setProperty('--vh',innerHeight+'px');
addEventListener('resize',setVh);addEventListener('orientationchange',setVh);setVh();
/* boot completo em ~6s: avisa o app (ou o corte do vídeo) nesse momento */
setTimeout(()=>{dispatchEvent(new CustomEvent('splash:ready'));try{if(window.AndroidSplash)AndroidSplash.onReady()}catch(e){}},6000);
</script>
</body>
</html>
